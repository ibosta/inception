services:
  mariadb:
    container_name: mariadb
    image: mariadb:inception
    build: requirements/mariadb
    env_file: .env
    secrets: [db_root_password, db_password]
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p$$(cat /run/secrets/db_root_password)"]
      interval: 5s
      retries: 10

  wordpress:
    container_name: wordpress
    image: wordpress:inception
    build: requirements/wordpress
    env_file: .env
    secrets: [db_password, wp_admin_password, wp_user_password]
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always

  nginx:
    container_name: nginx
    image: nginx:inception
    build: requirements/nginx
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: always

volumes:
  mariadb_data:
    driver_opts:
      type: none
      o: bind
      device: /home/itaskira/data/mariadb
  wordpress_data:
    driver_opts:
      type: none
      o: bind
      device: /home/itaskira/data/wordpress

networks:
  inception:

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
